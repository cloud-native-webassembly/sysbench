name: CI
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-20.04 ]
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config
      - name: Configure
        run: meson setup builddir -Dmysql=enabled -Dpgsql=enabled
      - name: Build
        run: meson compile -C builddir
      - name: MySQL version
        run: mysql_config --version
      - name: Sysbench version
        run: ./builddir/src/sysbench --version
      - name: Test
        run: meson test -C builddir --print-errorlogs

  build_mariadb:
    runs-on: ubuntu-22.04
    name: Build with MariaDB
    steps:
      - name: Setup MariaDB Repo
        run: |
          sudo apt-get install software-properties-common
          sudo apt-key adv --recv-keys --keyserver hkp://keyserver.ubuntu.com:80 0xF1656F24C74CD1D8
          sudo add-apt-repository 'deb [arch=amd64] https://ftp.nluug.nl/db/mariadb/repo/11.0/ubuntu jammy main'
      - name: Setup MariaDB Libs
        run: sudo apt install libmariadb-dev libmariadb-dev-compat
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config
      - name: Configure
        run: meson setup builddir -Dmysql=enabled -Dpgsql=enabled
      - name: Build
        run: meson compile -C builddir
      - name: MariaDB version
        run: mariadb_config --version
      - name: Sysbench version
        run: ./builddir/src/sysbench --version
      - name: Test
        run: meson test -C builddir --print-errorlogs

  # Build-matrix job: proves the conditional wiring tolerates missing optional
  # components (SC-006 subset check, gate G-3). Each configuration must configure
  # and compile with no optional dependency beyond what it names.
  build_matrix:
    runs-on: ubuntu-22.04
    name: Configuration matrix
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: minimal
            opts: ""
          - name: mysql-only
            opts: "-Dmysql=enabled"
          - name: pgsql-only
            opts: "-Dpgsql=enabled"
          - name: both-drivers
            opts: "-Dmysql=enabled -Dpgsql=enabled"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config
      - name: Configure (${{ matrix.config.name }})
        run: meson setup builddir ${{ matrix.config.opts }}
      - name: Build (${{ matrix.config.name }})
        run: meson compile -C builddir
